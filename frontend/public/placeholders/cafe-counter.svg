  </text>
  
  <rect x="280" y="440" width="240" height="34" rx="17" fill="#183D2B" fill-opacity="0.08"/>
  <text x="400" y="462" text-anchor="middle" fill="#183D2B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">
    MilletMarg Artisan Brews &amp; Pantry
  </text>
