<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#EFE8DC"/>
  <rect x="20" y="20" width="760" height="560" rx="20" stroke="#183D2B" stroke-width="2" stroke-dasharray="6 6" opacity="0.3"/>
  <circle cx="400" cy="240" r="140" fill="#F7F1E5" opacity="0.8"/>
  
  <!-- Counter & Beverage Bar Icon -->
  <g transform="translate(350, 180)" stroke="#183D2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Counter bar -->
    <rect x="10" y="65" width="80" height="40" rx="2"/>
    <line x1="5" y1="65" x2="95" y2="65"/>
    <!-- Jars and cup on counter -->
    <rect x="20" y="45" width="14" height="20" rx="2" fill="#D8A641" fill-opacity="0.3"/>
    <rect x="42" y="40" width="16" height="25" rx="2" fill="#879568" fill-opacity="0.3"/>
    <path d="M68 52 L78 52 L75 65 L71 65 Z" fill="#C66A45" fill-opacity="0.3"/>
    <!-- Steam -->
    <path d="M72 42 Q75 36 72 30" stroke-width="2"/>
  </g>

  <!-- Labels -->
  <text x="400" y="340" text-anchor="middle" fill="#183D2B" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold">
