<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="1000" fill="#EAE0CD"/>
  <rect x="20" y="20" width="760" height="960" rx="24" stroke="#183D2B" stroke-width="2" stroke-dasharray="8 8" opacity="0.3"/>
  
  <!-- Subtle background botanical watermark -->
