    <line x1="50" y1="75" x2="50" y2="105"/>
    <!-- Chairs -->
    <path d="M15 65 L25 65 L25 105 M15 90 L25 90"/>
    <path d="M85 65 L75 65 L75 105 M85 90 L75 90"/>
